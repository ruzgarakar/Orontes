name: Gunluk Hal Fiyatlari Kazima

on:
  schedule:
    # Her gün Türkiye saatiyle 07:30 (UTC 04:30)
    - cron: '30 4 * * *'
  workflow_dispatch: # Manuel tetikleme imkanı

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamini Kur
        uses: setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutuphaneleri Yukle
        run: |
          pip install requests beautifulsoup4 firebase-admin

      - name: Scraper Scriptini Calistir
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scraper.py
