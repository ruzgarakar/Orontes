name: Günlük Hal Fiyatları Botu

on:
  schedule:
    # Her sabah Türkiye saatiyle 08:00'de çalışır (UTC 05:00)
    - cron: '0 5 * * *'
  workflow_dispatch: # İstediğin zaman GitHub üzerinden manuel tetikleyebilmen için

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 firebase-admin

    - name: Botu Çalıştır ve Firebase'i Güncelle
      env:
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      run: python scraper.py
